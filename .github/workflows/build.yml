name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
      - name: Create signing key
        run: |
          keytool -genkey -keystore $HOME/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key -storepass android123 -keypass android123 -dname "CN=Classipod"
          cat > android/key.properties <<EOF
          storePassword=android123
          keyPassword=android123
          keyAlias=key
          storeFile=$HOME/release.jks
          EOF
      - run: flutter pub get
      - run: flutter build apk --release --flavor dev
      - uses: actions/upload-artifact@v4
        with:
          name: classipod-apk
          path: build/app/outputs/flutter-apk/*.apk
