name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
      - name: Create signing key
        run: |
          keytool -genkey -keystore $HOME/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key -storepass android123 -keypass android123 -dname "CN=Classipod"
          cat > android/key.properties <<EOF
          storePassword=android123
          keyPassword=android123
          keyAlias=key
          storeFile=$HOME/release.jks
          EOF
      - run: flutter pub get
      - run: flutter build apk --release --flavor dev
      - name: Rename APK
        run: cp "$(ls build/app/outputs/flutter-apk/*-release.apk | head -n 1)" CorrentPod.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" CorrentPod.apk \
            --title "CorrentPod build ${{ github.run_number }}" \
            --generate-notes \
            --target "${{ github.sha }}"
