name: Build APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "Missing secret SIGNING_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > $HOME/release.jks
          cat > android/key.properties <<EOF
          storePassword=$SIGNING_PASSWORD
          keyPassword=$SIGNING_PASSWORD
          keyAlias=$SIGNING_ALIAS
          storeFile=$HOME/release.jks
          EOF
      - run: flutter pub get
      - run: flutter build apk --release --flavor dev --build-number=${{ github.run_number }}
      - name: Rename APK
        run: cp "$(ls build/app/outputs/flutter-apk/*-release.apk | head -n 1)" CorrentPod.apk
      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "build-${{ github.run_number }}" CorrentPod.apk \
            --title "CorrentPod build ${{ github.run_number }}" \
            --generate-notes \
            --target "${{ github.sha }}"
      - name: Keep only the latest 5 releases
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' | xargs -r -n1 gh release delete --cleanup-tag --yes
